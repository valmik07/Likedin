name: Likedin v2.1.0 ARM64 Release & Auto-Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -iname '*.zip' -print)
          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one project ZIP in repository root, found ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi
          rm -rf build_src
          mkdir -p build_src
          unzip -q "${ZIP_FILES[0]}" -d build_src
          PUBSPEC_PATH="$(find build_src -maxdepth 3 -name pubspec.yaml | head -n 1)"
          APP_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          VERSION="$(grep -E '^version:' "$PUBSPEC_PATH" | head -n 1 | awk '{print $2}' | tr -d '\r')"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Detected app dir: $APP_DIR (version $VERSION)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$APP_DIR/android/upload-keystore.jks"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > "$APP_DIR/android/key.properties"
          fi

      - name: Fetch dependencies & analyze
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze

      - name: Build ARM64 release APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/likedin-arm64-v${APP_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: likedin-arm64-release-v${{ env.APP_VERSION }}
          path: likedin-arm64-v${{ env.APP_VERSION }}.apk

      - name: Publish GitHub Release for In-App Auto-Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Likedin v${{ env.APP_VERSION }}
          body: |
            - Pinned & starred messages
            - Telegram-style ||spoilers|| and *bold* / _italic_ / ~strikethrough~ formatting
            - Rich link previews
            - View-once (1x) photos
            - Live "Recording audio..." status
            - Built-in automatic in-app updates
          files: likedin-arm64-v${{ env.APP_VERSION }}.apk
