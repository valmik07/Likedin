
name: Likedin v1.9.11 Full Fixes ARM64 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: likedin-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Likedin v1.9.11 ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Prepare diagnostics
        shell: bash
        run: mkdir -p "$DIAGNOSTICS_DIR"

      - name: Extract and validate Likedin project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip' -print
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one project ZIP in repository root."
            echo "Found: ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          rm -rf source
          mkdir -p source

          unzip -t "${ZIP_FILES[0]}"
          unzip -q "${ZIP_FILES[0]}" -d source

          mapfile -t PROJECT_FILES < <(
            find source -type f -name pubspec.yaml -print
          )

          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one pubspec.yaml."
            echo "Found: ${#PROJECT_FILES[@]}"
            printf '%s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(realpath "$(dirname "${PROJECT_FILES[0]}")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          for required_file in \
            "$PROJECT_DIR/pubspec.yaml" \
            "$PROJECT_DIR/android/app/build.gradle.kts" \
            "$PROJECT_DIR/android/settings.gradle.kts" \
            "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.jar" \
            "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties" \
            "$PROJECT_DIR/android/app/google-services.json" \
            "$PROJECT_DIR/FIXES_V1_9.11.md"; do

            test -f "$required_file" || {
              echo "Missing required file: $required_file"
              exit 1
            }
          done

          SOURCE_VERSION="$(
            sed -n 's/^version:[[:space:]]*//p' \
            "$PROJECT_DIR/pubspec.yaml" | head -n 1
          )"

          if [ "$SOURCE_VERSION" != "1.9.11+97" ]; then
            echo "Expected version 1.9.11+97."
            echo "Found: ${SOURCE_VERSION:-missing}"
            exit 1
          fi

          SETTINGS_FILE="$PROJECT_DIR/android/settings.gradle.kts"
          WRAPPER_FILE="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_PROPERTIES="$PROJECT_DIR/android/gradle.properties"
          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle.kts"

          grep -Eq \
            'com\.android\.application.*version "9\.1\.0"' \
            "$SETTINGS_FILE"

          grep -Eq \
            'org\.jetbrains\.kotlin\.android.*version "2\.4\.0"' \
            "$SETTINGS_FILE"

          grep -Fq \
            'gradle-9.3.1-all.zip' \
            "$WRAPPER_FILE"

          grep -Fxq \
            'android.newDsl=false' \
            "$GRADLE_PROPERTIES"

          grep -Fxq \
            'android.builtInKotlin=false' \
            "$GRADLE_PROPERTIES"

          grep -Eq \
            'compileSdk = 36' \
            "$APP_GRADLE"

          grep -Eq \
            'minSdk = 30' \
            "$APP_GRADLE"

          echo "Validated Likedin source version $SOURCE_VERSION"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT" || {
            echo "Android SDK not found: $SDK_ROOT"
            exit 1
          }

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(
            find "$SDK_ROOT" -type f \
              -path '*/cmdline-tools/*/bin/sdkmanager' \
              -print | sort -V | tail -n 1
          )"

          test -n "$SDKMANAGER" || {
            echo "SDK Manager not found"
            exit 1
          }

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android API 36, Build Tools and NDK
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          dart --version
          java -version

          flutter doctor -v \
            2>&1 | tee "$DIAGNOSTICS_DIR/flutter-doctor.txt" || true

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get \
            2>&1 | tee "$DIAGNOSTICS_DIR/pub-get-log.txt"

          if [ -f pubspec.lock ]; then
            cp pubspec.lock "$DIAGNOSTICS_DIR/pubspec.lock"
            sha256sum pubspec.lock \
              > "$DIAGNOSTICS_DIR/pubspec-lock-sha256.txt"
          fi

      - name: Analyze source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze --no-fatal-infos \
            2>&1 | tee "$DIAGNOSTICS_DIR/analyze-log.txt"

      - name: Run Flutter tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter test --reporter expanded \
            2>&1 | tee "$DIAGNOSTICS_DIR/test-log.txt"

      - name: Build ARM64 Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose \
            2>&1 | tee "$DIAGNOSTICS_DIR/build-log.txt"

      - name: Verify APK signature
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -f "$APK" || {
            echo "Release APK was not generated."
            exit 1
          }

          test -x "$APKSIGNER" || {
            echo "APK signer not found: $APKSIGNER"
            exit 1
          }

          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            2>&1 | tee "$DIAGNOSTICS_DIR/apk-signature.txt"

          if [ -f "$PROJECT_DIR/android/key.properties" ]; then
            echo "Configured release signing detected."
          else
            echo "Temporary debug signing detected."
            echo "This APK is not signed with a private Play Store release key."
          fi

      - name: Collect build metadata
        if: always()
        shell: bash
        run: |
          set -u

          mkdir -p "$DIAGNOSTICS_DIR"

          {
            echo "LIKEDIN v1.9.11 FULL FIXES ARM64 BUILD"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo

            flutter --version 2>&1 || true
            dart --version 2>&1 || true
            java -version 2>&1 || true

            if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
              APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

              if [ -f "$APK" ]; then
                du -h "$APK"
                sha256sum "$APK"
              else
                echo "APK was not generated."
              fi
            else
              echo "Project extraction did not complete."
            fi

          } > "$DIAGNOSTICS_DIR/build-metadata.txt"

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: likedin-build-diagnostics-v1.9.11
          path: ${{ env.DIAGNOSTICS_DIR }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ARM64 APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: likedin-arm64-release-v1.9.11-full-fixes
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
