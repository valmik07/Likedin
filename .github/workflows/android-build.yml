name: Likedin v2.8.0 Strict Double Ratchet & Unrestricted Screenshots ARM64 Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      allow_debug_signing:
        description: 'Allow debug signing ONLY for local test builds when release keystore secrets are absent'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -iname '*.zip' -print)
          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one project ZIP in repository root, found ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi
          rm -rf build_src
          mkdir -p build_src
          unzip -q "${ZIP_FILES[0]}" -d build_src
          PUBSPEC_PATH="$(find build_src -maxdepth 3 -name pubspec.yaml | head -n 1)"
          APP_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          VERSION="$(grep -E '^version:' "$PUBSPEC_PATH" | head -n 1 | awk '{print $2}' | tr -d '\r')"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Detected app dir: $APP_DIR (version $VERSION)"

          # Ensure AGP 9.1.1 and Gradle 9.5.0 compatibility for Flutter 3.50+
          for f in "$APP_DIR/android/settings.gradle.kts" "$APP_DIR/android/settings.gradle"; do
            if [ -f "$f" ]; then
              sed -i 's/"9\.1\.0"/"9.1.1"/g' "$f"
            fi
          done
          WRAPPER="$APP_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's/gradle-9\.3\.1/gradle-9.5.0/g' "$WRAPPER"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android release signing (fail closed)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALLOW_DEBUG_SIGNING: ${{ github.event.inputs.allow_debug_signing || 'false' }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$APP_DIR/android/upload-keystore.jks"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > "$APP_DIR/android/key.properties"
            echo "IS_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          elif [ "$ALLOW_DEBUG_SIGNING" = "true" ]; then
            echo "ORG_GRADLE_PROJECT_allowDebugReleaseSigning=true" >> "$GITHUB_ENV"
            echo "IS_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Building with explicit debug-signing override (test only)."
          else
            echo "::error::Missing ANDROID_KEYSTORE_* release signing secrets. Refusing to silently build a debug-signed release APK."
            exit 1
          fi

      - name: Bundle Android 16 Noto Color Emoji font
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          if [ ! -s assets/fonts/NotoColorEmoji.ttf ]; then
            curl -fL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf" \
              -o assets/fonts/NotoColorEmoji.ttf \
            || curl -fL --retry 3 --retry-delay 2 \
              "https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@v2.051/fonts/NotoColorEmoji.ttf" \
              -o assets/fonts/NotoColorEmoji.ttf \
            || curl -fL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/notocoloremoji/NotoColorEmoji-Regular.ttf" \
              -o assets/fonts/NotoColorEmoji.ttf
          fi
          ls -lh assets/fonts/NotoColorEmoji.ttf

      - name: Fetch dependencies, analyze & test
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build compact ARM64 release APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/likedin-arm64-v${APP_VERSION}.apk"
          ls -lh "$GITHUB_WORKSPACE/likedin-arm64-v${APP_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: likedin-arm64-release-v${{ env.APP_VERSION }}
          path: likedin-arm64-v${{ env.APP_VERSION }}.apk

      - name: Publish GitHub Release for In-App Auto-Updater
        if: env.IS_RELEASE_SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Likedin v${{ env.APP_VERSION }} — Strict Double Ratchet & Unrestricted Screenshots
          body: |
            ### What's New in Likedin v${{ env.APP_VERSION }}
            - **Strict Fail-Closed E2EE:** Plaintext fallback on send is permanently disabled for text and media — messages only leave your phone encrypted.
            - **Pure-Dart Double Ratchet Forward Secrecy:** Upgraded to a Signal-style X25519 + HKDF-SHA256 + HMAC-SHA256 + AES-256-GCM Double Ratchet (`v2`) with per-message key destruction, out-of-order skipped-key support, and zero heavy native dependencies.
            - **Forward-Secret Encrypted Media & Encrypted Metadata:** Every photo, video, voice note, document, and thumbnail now uses a unique 256-bit per-file key, and its metadata JSON is Double-Ratchet encrypted (fully supported in Chat, Contact Info, and Files).
            - **Key-Change Send Lock:** Automatically pauses outgoing sends whenever your friend's identity key changes until you verify or accept the new safety fingerprint in Settings.
            - **Screenshots Enabled Everywhere:** Removed `FLAG_SECURE` blocking so screenshots now work across the entire app — even when hidden chats exist and inside hidden chats — while keeping hidden-chat password/biometric lock intact.
            - **OriginOS 7 Fluid Motion & Glide Dock:** Includes the 1:1 finger-gliding bottom tab bar, elastic spring scroll & swipe-to-reply physics, and 120 Hz Real Glass optimizations.
          files: likedin-arm64-v${{ env.APP_VERSION }}.apk
