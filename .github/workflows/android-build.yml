
name: Likedin v1.9.11 Full Fixes Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: likedin-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Likedin v1.9.11 ARM64 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Extract and validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=( *.zip )

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one source ZIP in repository root."
            echo "Found: ${#zips[@]}"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi

          ZIP_FILE="${zips[0]}"
          echo "Source archive: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          mapfile -t PUBSPEC_FILES < <(
            find extracted -type f -name pubspec.yaml
          )

          if [ "${#PUBSPEC_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one pubspec.yaml."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PUBSPEC_FILES[0]}")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            pubspec.yaml
            FIXES_V1_9.11.md
            android/settings.gradle.kts
            android/build.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties
            android/app/proguard-rules.pro
            android/app/google-services.json
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/kotlin/com/example/likedin/MainActivity.kt
            android/app/src/main/kotlin/com/example/likedin/CallForegroundService.kt
            test/chat_info_metrics_test.dart
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done

          echo "Source ZIP extracted and validated."

      - name: Validate project configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -q '^name: likedin$' pubspec.yaml
          grep -q '^version: 1.9.11+97$' pubspec.yaml

          grep -q 'com.example.likedin' android/app/build.gradle.kts
          grep -q 'namespace = "com.example.likedin"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.example.likedin"' android/app/build.gradle.kts

          grep -q 'com.android.application.*9.1.0' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.0' android/settings.gradle.kts
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties

          grep -q 'android.newDsl=false' android/gradle.properties
          grep -q 'android.builtInKotlin=false' android/gradle.properties

          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 30' android/app/build.gradle.kts
          grep -q 'ndkVersion = flutter.ndkVersion' android/app/build.gradle.kts

          echo "Project configuration matches the uploaded ZIP."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Display build environment
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Format Dart source
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart format lib test

      - name: Analyze Flutter source
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test --reporter expanded

      - name: Build ARM64 release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK size:"
          du -h "$APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          echo "Checking APK alignment..."
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          echo "Verifying APK signature..."
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          echo "Reading APK package information..."
          "$BUILD_TOOLS/aapt" dump badging "$APK" > apk-info.txt

          grep -q "package: name='com.example.likedin'" apk-info.txt
          grep -q "versionCode='97'" apk-info.txt
          grep -q "versionName='1.9.11'" apk-info.txt
          grep -q "sdkVersion:'30'" apk-info.txt

          cat apk-info.txt

          echo "APK verification successful."

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: likedin-v1.9.11-build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/build/
            ${{ env.PROJECT_DIR }}/.dart_tool/package_config.json
            ${{ env.PROJECT_DIR }}/pubspec.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload ARM64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Likedin-v1.9.11-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
