
name: Likedin Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Likedin ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Likedin project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_FILE=$(find source -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found."
            find "$SDK_ROOT" -maxdepth 4 -type d || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Found SDK Manager: $SDKMANAGER"

      - name: Install Android API 36
        shell: bash
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build ARM64 Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --target-platform android-arm64 --verbose 2>&1 | tee build-log.txt
          BUILD_STATUS=${PIPESTATUS[0]}
          exit $BUILD_STATUS

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: likedin-build-log
          path: ${{ env.PROJECT_DIR }}/build-log.txt
          if-no-files-found: warn

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: likedin-arm64-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
