name: Generate Android Keystore (One-Time)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Choose a strong password (letters & numbers, 8+ chars)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore likedin-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias likedin \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=Likedin, OU=App, O=Likedin, L=Valsad, ST=GJ, C=IN"
          base64 -w 0 likedin-release.jks > keystore-base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: likedin-keystore-backup
          path: |
            likedin-release.jks
            keystore-base64.txt
          retention-days: 1
          
